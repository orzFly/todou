<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>T-40 agent badge — 最终方案：模糊斑块 + free trio + harness 图标</title>
<style>
  /* Geist Variable to match the app; falls back to system-ui when offline. */
  @font-face {
    font-family: "Geist Variable";
    src: url("https://cdn.jsdelivr.net/fontsource/fonts/geist:vf@latest/latin-wght-normal.woff2") format("woff2-variations");
    font-weight: 100 900;
    font-display: swap;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font-family: "Geist Variable", ui-sans-serif, system-ui, sans-serif;
    background: oklch(0.97 0 0);
  }

  /* Minimal token set mirroring projects/web/src/styles.css */
  .panel {
    --background: oklch(1 0 0);
    --card: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --border: oklch(0.922 0 0);
    --secondary: oklch(0.97 0 0);
    --secondary-foreground: oklch(0.205 0 0);
    background: var(--background);
    color: var(--foreground);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 24px;
    width: fit-content;
  }
  .panel.dark {
    --background: oklch(0.145 0 0);
    --card: oklch(0.205 0 0);
    --foreground: oklch(0.985 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --border: oklch(1 0 0 / 10%);
    --secondary: oklch(0.269 0 0);
    --secondary-foreground: oklch(0.985 0 0);
  }

  .panel h2 { margin: 0 0 4px; font-size: 15px; }
  .panel .subtitle { margin: 0 0 16px; font-size: 11px; color: var(--muted-foreground); }

  table { border-collapse: collapse; }
  th, td { padding: 7px 10px; text-align: left; vertical-align: middle; }
  thead th {
    font-size: 10px; font-weight: 500; color: var(--muted-foreground);
    border-bottom: 1px solid var(--border);
  }
  thead .sid { font-family: ui-monospace, monospace; font-size: 9.5px; display: block; }
  thead .note { font-weight: 400; opacity: 0.75; }
  tbody th { font-size: 11px; font-weight: 500; white-space: nowrap; padding-right: 18px; text-align: left; }

  /* Badge geometry copied from ui/badge.tsx + agent-badge.tsx:
     h-5, rounded-4xl, px-1.5, text-[10px], font-normal, gap-1, svg size-3 */
  .badge {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 20px;
    padding: 0 6px;
    border-radius: 1.625rem;
    font-size: 10px;
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    isolation: isolate;
  }
  .badge > span, .badge > svg { position: relative; z-index: 1; }
  .badge > svg { width: 12px; height: 12px; flex-shrink: 0; }
  .badge .blobs {
    position: absolute;
    inset: -35%;              /* oversize so the blur has no hard edges */
    filter: blur(5px);
    z-index: 0;
  }
  .badge.neutral { background: var(--secondary); color: var(--secondary-foreground); }

  .cell { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
  .contrast { font-size: 9px; font-family: ui-monospace, monospace; color: var(--muted-foreground); }
  .contrast .fail { color: oklch(0.577 0.245 27.325); font-weight: 700; }

  .context-strip {
    margin-top: 14px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--card);
    font-size: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .context-strip .row { display: flex; align-items: center; gap: 8px; }
  .context-strip .meta { color: var(--muted-foreground); font-size: 11px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ---------- deterministic hash: FNV-1a 32-bit over the whole session id ----------
   Avalanche matters here: ids differing in one char must land on unrelated colors. */
function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}
/* Second independent 32-bit stream so the third hue doesn't reuse correlated bits. */
function fnv1aRev(str) {
  return fnv1a(str.split("").reverse().join("") + "#2");
}

/* Free trio: three independent 10-bit hash slices each mapped to 0-360°.
   L/C are clamped per theme so text contrast is hue-independent (OKLCH keeps
   perceived lightness constant). */
const THEME = {
  light: { L: 0.92, C: 0.088, dL: 0.02, textFor: h => `oklch(0.28 0.015 ${h})` },
  dark:  { L: 0.36, C: 0.105, dL: 0.03, textFor: h => `oklch(0.96 0.01 ${h})` },
};

function trioColors(id, t) {
  const h1 = fnv1a(id), h2 = fnv1aRev(id);
  const hues = [
    (h1 & 1023) * 360 / 1024,
    ((h1 >>> 10) & 1023) * 360 / 1024,
    ((h2 >>> 4) & 1023) * 360 / 1024,
  ];
  const stops = hues.map((h, i) => {
    const L = t.L + (i - 1) * t.dL;
    const C = t.C * (i === 1 ? 1.0 : 0.85);
    return `oklch(${L.toFixed(3)} ${C.toFixed(3)} ${h.toFixed(1)})`;
  });
  return { hues, stops, baseHue: hues[0] };
}

function applyBlobs(el, c, id) {
  const h = fnv1aRev(id);
  const px = 20 + (h & 63);            // hash-fixed blob anchors
  const py = 20 + ((h >>> 6) & 63);
  const blobs = document.createElement("i");
  blobs.className = "blobs";
  blobs.style.background = [
    `radial-gradient(90% 130% at ${px}% ${py > 50 ? 15 : 85}%, ${c.stops[1]} 0%, transparent 70%)`,
    `radial-gradient(90% 130% at ${100 - px}% ${py}%, ${c.stops[2]} 0%, transparent 70%)`,
    c.stops[0],
  ].join(", ");
  el.prepend(blobs);
}

/* ---------- harness icons ----------
   claude-* → Claude sunburst (simple-icons, fill=currentColor)
   anything else → generic bot (lucide "bot", stroke=currentColor) */
const CLAUDE_PATH = "m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z";
const NS = "http://www.w3.org/2000/svg";

function makeIcon(harness) {
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  if (/^claude/i.test(harness || "")) {
    svg.setAttribute("fill", "currentColor");
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", CLAUDE_PATH);
    svg.appendChild(p);
  } else {
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "2");
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");
    svg.innerHTML = '<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>';
  }
  return svg;
}

/* ---------- samples: near-identical prefixes + fallback/edge states ---------- */
const SESSIONS = [
  { id: "0198a3c2-7f41-4b2e-9d3a-1c5e8b2a9f10", harness: "claude-code", model: "claude-fable-5",  note: "样例 A" },
  { id: "0198a3c2-7f41-4b2e-9d3a-1c5e8b2a9f11", harness: "claude-code", model: "claude-fable-5",  note: "A′ 仅末位不同" },
  { id: "0198a3c2-7f41-4b2e-8d3a-1c5e8b2a9f10", harness: "claude-code", model: "claude-opus-5",   note: "A″ 仅中段一位不同" },
  { id: "b7e9d4f6-2a81-47c3-9e5f-8d1a6c4b2e97", harness: "claude-code", model: "claude-sonnet-5", note: "样例 B" },
  { id: "3f2a8c1d-9b64-4e07-a2d8-5c7e1f9a3b46", harness: "aider",       model: "gpt-5-codex",     note: "未知 harness → bot 图标" },
  { id: "7c4e1a9b-5d28-4f6a-b3e9-2a8d6c1f4e73", harness: "claude-code", model: null,              note: "无 model → 显示 harness" },
  { id: null,                                    harness: "claude-code", model: "claude-fable-5",  note: "无 session_id → 中性底" },
];

/* ---------- WCAG contrast, measured through canvas so oklch resolves to real sRGB ---------- */
const ctx = document.createElement("canvas").getContext("2d", { willReadFrequently: true });
function toRGB(css) {
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 1, 1);
  ctx.fillStyle = css; ctx.fillRect(0, 0, 1, 1);
  return ctx.getImageData(0, 0, 1, 1).data;
}
function luminance(rgb) {
  const f = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
  return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]);
}
function ratio(a, b) {
  const [hi, lo] = [Math.max(a, b), Math.min(a, b)];
  return (hi + 0.05) / (lo + 0.05);
}
function minContrast(textCss, bgCsss) {
  const tl = luminance(toRGB(textCss));
  return Math.min(...bgCsss.map(s => ratio(tl, luminance(toRGB(s)))));
}

/* ---------- render ---------- */
function shortId(id) { return id ? id.slice(0, 8) + "…" + id.slice(-4) : "(缺失)"; }

function makeBadge(session, t, panel) {
  const badge = document.createElement("span");
  badge.className = "badge";
  badge.appendChild(makeIcon(session.harness));
  const label = document.createElement("span");
  label.textContent = session.model ?? session.harness;
  badge.appendChild(label);

  if (!session.id) {
    badge.classList.add("neutral");
    const cs = getComputedStyle(panel);
    return { badge, contrast: minContrast(cs.getPropertyValue("--secondary-foreground"), [cs.getPropertyValue("--secondary")]) };
  }
  const c = trioColors(session.id, t);
  const textCss = t.textFor(c.baseHue);
  badge.style.color = textCss;
  applyBlobs(badge, c, session.id);
  return { badge, contrast: minContrast(textCss, c.stops) };
}

function renderPanel(themeKey) {
  const t = THEME[themeKey];
  const panel = document.createElement("section");
  panel.className = "panel" + (themeKey === "dark" ? " dark" : "");
  panel.id = "panel-" + themeKey;
  document.getElementById("root").appendChild(panel);   // attach before getComputedStyle
  panel.innerHTML = `
    <h2>${themeKey === "dark" ? "深色主题（.dark tokens）" : "浅色主题"} — 模糊斑块 · free trio · harness 图标</h2>
    <p class="subtitle">色停 L=${t.L} C=${t.C}（OKLCH 定亮度）· 数字 = 文字 vs 三色停的最差 WCAG 对比度，✓ ≥ 4.5:1 (AA)</p>`;

  const table = document.createElement("table");
  const thead = document.createElement("thead");
  thead.innerHTML = "<tr>" + SESSIONS.map(s =>
    `<th><span class="sid">${shortId(s.id)}</span><span class="note">${s.note}</span></th>`).join("") + "</tr>";
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  const tr = document.createElement("tr");
  let panelMin = Infinity;
  for (const session of SESSIONS) {
    const td = document.createElement("td");
    const cell = document.createElement("div");
    cell.className = "cell";
    const { badge, contrast } = makeBadge(session, t, panel);
    panelMin = Math.min(panelMin, contrast);
    const note = document.createElement("span");
    note.className = "contrast";
    note.innerHTML = contrast >= 4.5
      ? `${contrast.toFixed(1)}:1 ✓`
      : `<span class="fail">${contrast.toFixed(1)}:1 ✗</span>`;
    cell.append(badge, note);
    td.appendChild(cell);
    tr.appendChild(td);
  }
  tbody.appendChild(tr);
  table.appendChild(tbody);
  panel.appendChild(table);

  /* 3× magnified strip: icon crispness + blob texture check */
  const zoom = document.createElement("div");
  zoom.className = "context-strip";
  const zrow = document.createElement("div");
  zrow.className = "row";
  const zmeta = document.createElement("span");
  zmeta.className = "meta";
  zmeta.textContent = "3× 放大（图标清晰度 / 斑块质感）";
  zrow.appendChild(zmeta);
  for (const session of [SESSIONS[0], SESSIONS[4], SESSIONS[6]]) {
    const wrap = document.createElement("span");
    wrap.style.cssText = "display:inline-block; width:300px; height:60px;";
    const { badge } = makeBadge(session, t, panel);
    badge.style.transform = "scale(3)";
    badge.style.transformOrigin = "left center";
    badge.style.marginTop = "20px";
    wrap.appendChild(badge);
    zrow.appendChild(wrap);
  }
  zoom.appendChild(zrow);
  panel.appendChild(zoom);

  /* in-context preview: badge inline in a fake timeline row */
  const strip = document.createElement("div");
  strip.className = "context-strip";
  const row = document.createElement("div");
  row.className = "row";
  const meta = document.createElement("span");
  meta.className = "meta";
  meta.textContent = "claude-agent commented · 3m ago —";
  row.appendChild(meta);
  for (const session of [SESSIONS[0], SESSIONS[3], SESSIONS[4]]) {
    row.appendChild(makeBadge(session, t, panel).badge);
  }
  strip.appendChild(row);
  panel.appendChild(strip);

  const sum = panel.querySelector(".subtitle");
  sum.textContent += ` · 本面板最低对比度 ${panelMin.toFixed(2)}:1`;
}

renderPanel("light");
renderPanel("dark");
</script>
</body>
</html>
