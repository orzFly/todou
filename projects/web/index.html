<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // iOS Safari auto-zooms when a focused control renders below 16px —
      // and it judges the *effective* size, so Page Zoom < 100% re-triggers
      // it no matter what font-size the CSS asks for. Since iOS 10 Safari
      // ignores maximum-scale for user pinch zoom but still honors it for
      // that focus auto-zoom, so this kills the zoom without hurting zoom
      // accessibility. Never ship it to other engines: Android Chrome
      // enforces maximum-scale for pinch too (WCAG 1.4.4 failure). iPadOS
      // reports a Mac UA, hence the maxTouchPoints probe.
      if (
        /iPhone|iPod|iPad/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
      ) {
        document
          .querySelector("meta[name=viewport]")
          .setAttribute(
            "content",
            "width=device-width, initial-scale=1.0, maximum-scale=1",
          );
      }
    </script>
    <title>todou 🥔</title>
    <script>
      // Paint guard: apply the persisted theme before the bundle loads so a
      // dark-theme reload never flashes white. lib/theme.ts owns these keys;
      // the resolved kind is stored separately so this stays slug-agnostic.
      (() => {
        try {
          const theme = localStorage.getItem("todou-theme");
          const kind = localStorage.getItem("todou-theme-kind");
          const dark = kind
            ? kind === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
          if (theme && theme !== "system")
            document.documentElement.dataset.theme = theme;
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
