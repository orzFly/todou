name: Docker

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# The image name is NOT ${{ github.repository }}: that expands with the
# owner's original casing and registry references must be lowercase. Both
# jobs resolve it from scripts/docker-image-ref.sh — the same derivation
# local builds use — into $REGISTRY_IMAGE via $GITHUB_ENV.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Native runners for both platforms — no QEMU emulation.
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare platform slug and image ref
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "REGISTRY_IMAGE=$(scripts/docker-image-ref.sh)" >> "$GITHUB_ENV"
      # Tags come from the merge job; this instance only supplies the OCI
      # labels, which have to be baked in at build time.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image ref
        run: echo "REGISTRY_IMAGE=$(scripts/docker-image-ref.sh)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # In the date tag the timestamp leads, zero-padded and UTC, so that
          # sorting those tags alphabetically sorts them by age: `sha-*` can be
          # pinned but never ordered, which left rollback targets to guesswork.
          # It is the *commit's* date, not the run's, so re-running a build or
          # dispatching an older ref reproduces the earlier tag instead of
          # stamping today onto old code. Its priority stays at raw's default
          # 200 — under edge's 700 and semver's 900 — to keep the `version`
          # output, and the OCI version label, off the timestamp.
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value={{commit_date 'YYYYMMDD-HHmmss'}}-{{sha}}
            type=sha
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}"
